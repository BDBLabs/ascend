# Ascend Product — Storefront and Field.
#
# Deploy from the REPOSITORY ROOT so the Docker build context includes the
# workspace lockfile and packages/*:
#
#   fly deploy --config fly.product.toml
#
app = 'ascend-product'
# Same region as the Neon project (aws-us-east-1). Every request makes several
# round trips to Postgres, so co-location with the database matters more here
# than edge proximity to the visitor.
primary_region = 'iad'

# Environment identity (P1.3, P0.1): a production build outside Vercel must
# declare it. The apps refuse a database stamped for another environment, and
# a production deployment refuses to start with any demo-principal variable.
[env]
  ASCEND_ENVIRONMENT = 'production'

[build]
  dockerfile = 'apps/product/Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true

  # Load-bearing. Fly's default is to stop idle machines, which would
  # reintroduce exactly the cold starts and dropped background work this move
  # was made to eliminate. Keep one machine running.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
