name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The full quality gate (workflow lint, verify, DB isolation from zero) --
  # the same workflow main and pull requests run, not a copy of it.
  quality:
    uses: ./.github/workflows/quality.yml

  docker:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build product image
        run: docker build -f apps/product/Dockerfile -t "ascend-product:${GITHUB_REF_NAME}" .
      - name: Build control image
        run: docker build -f apps/control/Dockerfile -t "ascend-control:${GITHUB_REF_NAME}" .

  github-release:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
