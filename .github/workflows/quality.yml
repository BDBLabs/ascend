name: quality

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow calls this one, so a tag is released only from a
  # commit that passes the same gate as main.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lints the workflows themselves (P1.2). An earlier quality.yml referenced a
  # secret in a job-level `if`, which GitHub rejects at parse time: every run
  # failed with zero jobs. actionlint catches that class of error before merge.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run secrets:check
      - run: npm run lint
      - run: npm test
      - run: npm run build:all
      - run: npm run audit:production

  # Tenant isolation, function ACLs, document integrity and regression suites
  # against a disposable PostgreSQL built from zero by the migration runner.
  # Needs no secret, so it runs on every push and pull request -- including
  # forks. (The job it replaces gated its only step on an env var declared on
  # that same step, which a step's `if` cannot see, so it always skipped and
  # reported green.) The owner role mirrors Neon's
  # (CREATEROLE + BYPASSRLS, not superuser); the login roles mirror
  # scripts/provision-neon-branch.mjs so the ACL suite checks them too.
  isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JBOX_ENVIRONMENT: ci
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-superuser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create the owner role and database
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE jbox_owner LOGIN CREATEROLE BYPASSRLS PASSWORD 'ci-only'"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE jbox OWNER jbox_owner"
          psql -v ON_ERROR_STOP=1 -d jbox -c "ALTER SCHEMA public OWNER TO jbox_owner"
      - name: Migrate from zero
        run: npm run db:migrate
        env:
          DATABASE_URL_OWNER: postgresql://jbox_owner:ci-only@localhost:5432/jbox
      - name: Create restricted login roles (as provision-neon-branch.mjs does)
        run: |
          psql -v ON_ERROR_STOP=1 -d jbox <<'SQL'
          CREATE ROLE jbox_runtime LOGIN PASSWORD 'ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT contractor_app, platform_runtime TO jbox_runtime;
          GRANT USAGE ON SCHEMA public TO jbox_runtime;
          CREATE ROLE jbox_control LOGIN PASSWORD 'ci-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT control_app, contractor_app TO jbox_control;
          GRANT USAGE ON SCHEMA public TO jbox_control;
          SQL
      - name: Run every check suite
        run: npm run db:verify
        env:
          DATABASE_URL_OWNER: postgresql://jbox_owner:ci-only@localhost:5432/jbox
      - name: Re-running the migrator is a no-op
        run: npm run db:migrate | tee migrate.log && grep -q 'up to date' migrate.log
        env:
          DATABASE_URL_OWNER: postgresql://jbox_owner:ci-only@localhost:5432/jbox
      - name: Cross-environment runs are refused before touching the database
        env:
          DATABASE_URL_OWNER: postgresql://jbox_owner:ci-only@localhost:5432/jbox
        run: |
          set +e
          JBOX_ENVIRONMENT=production node packages/database/verify.mjs; code=$?
          test "$code" -eq 3 || { echo "verify against production exited $code, expected refusal (3)"; exit 1; }
          JBOX_ENVIRONMENT=development node packages/database/verify.mjs; code=$?
          test "$code" -eq 3 || { echo "stamp mismatch exited $code, expected refusal (3)"; exit 1; }
          echo "cross-environment runs refused"
